    <script>
      // Safe guard against libraries or runtime scripts assigning window.fetch when it has only a getter
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = realFetch;
          
          // Define a writable property on window so `window.fetch = ...` succeeds without throwing
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch || (realFetch ? realFetch : window.fetch);
              },
              set: function(newFetchFn) {
                activeFetch = newFetchFn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            // If already non-configurable on window, set on Window prototype
            try {
              if (window.Window && window.Window.prototype) {
                Object.defineProperty(window.Window.prototype, 'fetch', {
                  get: function() {
                    return activeFetch || (realFetch ? realFetch : null);
                  },
                  set: function(newFetchFn) {
                    activeFetch = newFetchFn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (err) {}
      })();
